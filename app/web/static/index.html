<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EC20 SIP 网关</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>EC20 SIP</div>
    <nav>
      <a href="#/dashboard" data-view="dashboard">概览</a>
      <a href="#/extensions" data-view="extensions">分机</a>
      <a href="#/sms" data-view="sms">短信</a>
      <a href="#/rules" data-view="rules">转发规则</a>
      <a href="#/settings" data-view="settings">设置</a>
      <a href="#/logs" data-view="logs">日志</a>
    </nav>
    <div class="sidebar-foot"><span id="ver">v1.0.0</span></div>
  </aside>

  <main>
    <header class="topbar">
      <div class="top-items">
        <span id="pill" class="pill offline">离线</span>
        <span class="signal"><i></i><i></i><i></i><i></i><i></i></span>
        <span id="callcount" class="chip">通话中 0</span>
        <span id="meminfo" class="chip">内存 -</span>
      </div>
      <div class="top-actions">
        <button class="btn ghost" data-action="refresh">刷新</button>
        <button class="btn ghost" data-action="logout">退出</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="toasts" class="toasts"></div>

<div id="login" class="overlay hidden">
  <form id="loginform" class="dialog small">
    <h2>登录管理面板</h2>
    <label>用户名<input id="login-user" autocomplete="username" value="admin"></label>
    <label>密码<input id="login-pass" type="password" autocomplete="current-password"></label>
    <div class="row end">
      <button class="btn primary" type="submit">登录</button>
    </div>
    <p id="login-err" class="err"></p>
  </form>
</div>

<div id="modal" class="overlay hidden"><div class="dialog" id="modalbody"></div></div>
<script src="/static/app.js"></script>
</body>
</html>
