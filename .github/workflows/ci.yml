name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # The appliance runs Python 3.8.10 (Ubuntu 20.04), so verify that exact
    # version on a runner that still provides it, plus a modern one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + integration tests
        run: python -m unittest discover -s tests -v
      - name: Panel/API consistency
        run: python tools/check_api.py
      - name: Byte-compile everything
        run: python -m compileall -q app tools tests
      - name: Shell syntax
        run: |
          for f in install.sh scripts/*.sh; do sh -n "$f" || exit 1; done
      - name: Panel UI self-check
        if: matrix.python == '3.11'
        run: node tools/check_ui.js