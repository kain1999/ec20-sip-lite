# ---------------------------------------------------------------- SIP 信令
# 必须是 tcp：一条连接对应一台分机，服务端才能沿连接把 INVITE/BYE 反向送到
# NAT 后面的分机（frp 的 udp 隧道做不到这一点）。
[[proxies]]
type = "tcp"
name = "zlA7px5GTCm4"
localIP = "127.0.0.1"
localPort = 5060
remotePort = 5060
transport.useEncryption = true
transport.useCompression = true

# ------------------------------------------------------------ RTP 媒体端口
# 必须是 udp：RTP 本身就是 UDP，tcp 隧道转发不了。
# 每个端口支撑 1 路并发通话；要多路就继续加同名规则的隧道并把端口加进
# /etc/ec20-sip/config.json 的 sip.rtp_ports。
[[proxies]]
type = "udp"
name = "GjAnRK4hJQbz"
localIP = "127.0.0.1"
localPort = 10000
remotePort = 10000
transport.useEncryption = true
